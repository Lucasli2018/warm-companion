<!DOCTYPE html>

<meta charset="UTF-8" data-page-node-id="cYjWwr0Oe6OChwVJkOgi5j">

<title>温暖陪伴 · 阿溪</title>
<style>
  /* ===== Design Tokens ===== */
  :root{
    --glass-bg:rgba(20,14,10,.38);
    --glass-bg-strong:rgba(20,14,10,.52);
    --glass-border:rgba(255,255,255,.10);
    --glass-hi:rgba(255,255,255,.06);
    --c-text:#FFF8F0;
    --c-text-sub:rgba(255,248,240,.72);
    --c-text-faint:rgba(255,248,240,.45);
    --c-coral:#F08A7E;
    --c-coral-light:#FFB5A7;
    --c-online:#6DDC8E;
    --bubble-ai:rgba(255,255,255,.90);
    --bubble-ai-text:#3A2A22;
    --bubble-user:rgba(240,138,126,.82);
    --r-bubble:20px;
    --r-pill:999px;
    --shadow-glow:0 4px 24px rgba(0,0,0,.18);
    --font-stack:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font-stack);
    background:#1A0F0A;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;overflow:hidden;
  }

  /* ===== Phone Frame (Portrait) ===== */
  .phone-stage{
    position:relative;
    width:393px;height:852px;
    flex-shrink:0;
    border-radius:56px;
    background:linear-gradient(145deg,#3A2A24 0%,#1E1410 50%,#2A1C16 100%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,.04),
      0 4px 8px rgba(0,0,0,.3),
      0 30px 80px rgba(0,0,0,.5),
      inset 0 1px 2px rgba(255,255,255,.08);
  }
  /* Side buttons */
  .phone-stage::before{
    content:"";position:absolute;left:-3px;top:180px;
    width:3px;height:32px;border-radius:2px;
    background:linear-gradient(90deg,#2A1C16,#3A2A24);
  }
  .phone-stage::after{
    content:"";position:absolute;left:-3px;top:230px;
    width:3px;height:70px;border-radius:2px;
    background:linear-gradient(90deg,#2A1C16,#3A2A24);
  }
  .side-right{
    position:absolute;right:-3px;top:200px;
    width:3px;height:100px;border-radius:2px;
    background:linear-gradient(270deg,#2A1C16,#3A2A24);
  }

  /* Dynamic Island */
  .dynamic-island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:120px;height:35px;border-radius:20px;
    background:#000;z-index:200;
    box-shadow:0 0 4px rgba(0,0,0,.3);
  }

  /* ===== Screen ===== */
  .screen{
    position:absolute;
    top:8px;left:8px;right:8px;bottom:8px;
    border-radius:48px;
    overflow:hidden;
    background:#1A0F0A;
    display:flex;flex-direction:column;
  }

  /* Background Image (full-bleed) */
  .bg-image{
    position:absolute;inset:0;
    background:url('assets/bg-character.jpg') center/cover no-repeat;
    z-index:0;
  }
  .bg-overlay{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,
      rgba(20,14,10,.45) 0%,
      rgba(20,14,10,.20) 15%,
      rgba(20,14,10,.10) 40%,
      rgba(20,14,10,.10) 60%,
      rgba(20,14,10,.40) 88%,
      rgba(20,14,10,.55) 100%
    );
  }

  /* ===== Status Bar ===== */
  .status-bar{
    position:relative;z-index:10;
    height:54px;flex-shrink:0;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 28px 6px;
    color:#fff;font-size:14px;font-weight:600;
  }
  .status-time{letter-spacing:.5px}
  .status-icons{display:flex;align-items:center;gap:6px}
  .status-icons svg{width:16px;height:16px;fill:#fff}

  /* ===== Header (Glassmorphism) ===== */
  .chat-header{
    position:relative;z-index:10;
    display:flex;align-items:center;gap:12px;
    padding:8px 16px 10px;
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-bottom:1px solid var(--glass-border);
  }
  .header-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);
    border:1px solid var(--glass-border);
    color:var(--c-text);cursor:pointer;transition:.2s;
    flex-shrink:0;
  }
  .header-btn:hover{background:rgba(255,255,255,.14);transform:scale(1.05)}
  .header-btn:active{transform:scale(.92)}
  .header-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .header-profile{
    flex:1;display:flex;align-items:center;gap:10px;
    min-width:0;
  }
  .header-avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#F7B267,#F08A7E);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:600;color:#fff;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    overflow:hidden;
  }
  .header-avatar img{width:100%;height:100%;object-fit:cover}
  .header-info{flex:1;min-width:0}
  .header-name{
    font-size:16px;font-weight:600;color:var(--c-text);
    line-height:1.2;
  }
  .header-status{
    display:flex;align-items:center;gap:5px;margin-top:3px;
    font-size:12px;color:var(--c-online);
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;background:var(--c-online);
    box-shadow:0 0 0 0 rgba(109,220,142,.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(109,220,142,.5)}
    70%{box-shadow:0 0 0 6px rgba(109,220,142,0)}
    100%{box-shadow:0 0 0 0 rgba(109,220,142,0)}
  }

  /* ===== Quick Tags Row ===== */
  .quick-tags{
    position:relative;z-index:10;
    display:flex;gap:8px;
    padding:10px 16px;
    overflow-x:auto;
    scrollbar-width:none;
    flex-shrink:0;
  }
  .quick-tags::-webkit-scrollbar{display:none}
  .quick-tag{
    flex-shrink:0;
    padding:8px 16px;
    border-radius:var(--r-pill);
    background:rgba(20,14,10,.30);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    color:var(--c-text);
    font-size:13px;font-weight:500;cursor:pointer;
    transition:.2s;white-space:nowrap;
    display:flex;align-items:center;gap:5px;
  }
  .quick-tag:hover{
    background:rgba(240,138,126,.35);
    border-color:rgba(240,138,126,.4);
    transform:translateY(-1px);
  }
  .quick-tag:active{transform:scale(.96)}
  .quick-tag .emoji{font-size:14px}

  /* ===== Chat Body ===== */
  .chat-body{
    position:relative;z-index:5;
    flex:1;overflow-y:auto;
    padding:16px 14px 8px;
    scroll-behavior:smooth;
  }
  .chat-body::-webkit-scrollbar{width:0}

  .msg{
    display:flex;gap:8px;margin-bottom:14px;
    align-items:flex-end;
    animation:bubbleIn .35s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes bubbleIn{
    from{opacity:0;transform:translateY(10px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .msg.user{flex-direction:row-reverse}

  .msg-avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .msg-avatar.ai{background:linear-gradient(135deg,#F7B267,#F08A7E)}
  .msg-avatar.user{background:linear-gradient(135deg,#9BB7E8,#7E9BD6)}

  .bubble{
    max-width:75%;padding:12px 16px;
    border-radius:var(--r-bubble);
    font-size:14px;line-height:1.65;word-break:break-word;
    position:relative;
    box-shadow:var(--shadow-glow);
  }
  .msg.ai .bubble{
    background:var(--bubble-ai);
    backdrop-filter:blur(6px);
    color:var(--bubble-ai-text);
    border-bottom-left-radius:6px;
  }
  .msg.user .bubble{
    background:var(--bubble-user);
    backdrop-filter:blur(6px);
    color:#fff;
    border-bottom-right-radius:6px;
  }
  .bubble strong{font-weight:600}
  .bubble em{font-style:italic;color:var(--c-coral)}
  .bubble .code-block{
    display:block;margin:8px 0;padding:10px 12px;
    background:#3A2A22;color:#FFD3C4;border-radius:10px;
    font-family:"SF Mono","Consolas","Monaco",monospace;font-size:12px;
    overflow-x:auto;white-space:pre;
  }
  .bubble .code-block .k{color:#FFB5A7}
  .bubble .code-block .s{color:#C8E6C9}
  .bubble .code-block .c{color:#9A8A82;font-style:italic}
  .bubble .inline-code{
    background:rgba(240,138,126,.12);color:#C76A5E;
    padding:1px 6px;border-radius:5px;
    font-family:"SF Mono","Consolas",monospace;font-size:12px;
  }
  .bubble .caret{
    display:inline-block;width:2px;height:15px;
    background:var(--c-coral);margin-left:2px;vertical-align:-3px;
    animation:blink .9s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* loading dots */
  .loading-bubble{display:flex;gap:5px;align-items:center;padding:14px 16px}
  .loading-bubble .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--c-coral);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .loading-bubble .dot:nth-child(2){animation-delay:.15s}
  .loading-bubble .dot:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,80%,100%{transform:scale(.6);opacity:.4}
    40%{transform:scale(1);opacity:1}
  }

  .msg-time{
    font-size:10px;color:rgba(255,255,255,.35);
    margin:2px 38px 0;
  }
  .msg.user+.msg-time{text-align:right}

  /* ===== Input Area (Glassmorphism) ===== */
  .chat-input{
    position:relative;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:10px 16px 22px;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
    border-top:1px solid var(--glass-border);
    flex-shrink:0;
  }
  .input-wrap{
    flex:1;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:var(--r-pill);
    padding:7px 7px 7px 18px;
    transition:.2s;
  }
  .input-wrap:focus-within{
    border-color:rgba(240,138,126,.5);
    background:rgba(255,255,255,.12);
    box-shadow:0 0 0 3px rgba(240,138,126,.10);
  }
  .input-wrap input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:14px;color:var(--c-text);font-family:inherit;
    padding:6px 0;
  }
  .input-wrap input::placeholder{color:var(--c-text-faint)}
  .send-btn{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,#FFB5A7,#F08A7E);color:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;flex-shrink:0;
    box-shadow:0 3px 12px rgba(240,138,126,.35);
  }
  .send-btn:hover:not(:disabled){transform:scale(1.08);box-shadow:0 4px 16px rgba(240,138,126,.5)}
  .send-btn:active{transform:scale(.92)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .send-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .send-btn.sending svg{animation:sendFly .5s ease}
  @keyframes sendFly{
    0%{transform:translateX(0) rotate(0)}
    50%{transform:translateX(4px) rotate(-15deg)}
    100%{transform:translateX(0) rotate(0)}
  }

  /* ===== Drawer (Hamburger Menu) ===== */
  .drawer-overlay{
    position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto}

  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:160;
    width:300px;
    background:linear-gradient(180deg,#FFF8F3 0%,#FEEFE5 100%);
    transform:translateX(-105%);
    transition:transform .35s cubic-bezier(.22,.8,.2,1);
    display:flex;flex-direction:column;
    box-shadow:4px 0 30px rgba(0,0,0,.15);
  }
  .drawer.open{transform:translateX(0)}

  .drawer-head{
    padding:20px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-title{font-size:16px;font-weight:600;color:#4A3B35}
  .drawer-close{
    width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:#FFE5DC;color:#F08A7E;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .drawer-close:hover{background:#F08A7E;color:#fff}
  .drawer-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .drawer-search{
    margin:0 14px 12px;
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid #F3E2D8;
    border-radius:999px;padding:8px 14px;
  }
  .drawer-search svg{width:14px;height:14px;stroke:#C4B5AE;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .drawer-search input{
    border:none;outline:none;background:transparent;flex:1;
    font-size:13px;color:#4A3B35;font-family:inherit;
  }
  .drawer-search input::placeholder{color:#C4B5AE}

  .drawer-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .drawer-list::-webkit-scrollbar{width:4px}
  .drawer-list::-webkit-scrollbar-thumb{background:#F3E2D8;border-radius:4px}

  .conv-item{
    display:flex;gap:10px;align-items:center;
    padding:10px 8px;border-radius:16px;
    cursor:pointer;transition:.18s;margin-bottom:2px;
    position:relative;
  }
  .conv-item:hover{background:rgba(255,229,220,.5)}
  .conv-item.active{background:rgba(240,138,126,.12)}
  .conv-avatar{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:600;color:#fff;
    position:relative;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .conv-avatar.axi{background:linear-gradient(135deg,#F7B267,#F08A7E)}
  .conv-avatar.morning{background:linear-gradient(135deg,#A8C8A0,#7DB996)}
  .conv-avatar.night{background:linear-gradient(135deg,#9BB7E8,#7E9BD6)}
  .conv-avatar.daily{background:linear-gradient(135deg,#E8B8C8,#D694AC)}
  .conv-online-dot{
    position:absolute;right:0;bottom:0;
    width:11px;height:11px;border-radius:50%;
    background:#7DB996;border:2px solid #fff;
  }
  .conv-body{flex:1;min-width:0}
  .conv-name{
    font-size:14px;font-weight:600;color:#4A3B35;
    display:flex;align-items:center;justify-content:space-between;
  }
  .conv-time{font-size:10px;color:#C4B5AE;font-weight:400}
  .conv-last{
    font-size:12px;color:#9A8A82;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .conv-unread{
    position:absolute;right:8px;top:8px;
    min-width:16px;height:16px;border-radius:8px;
    background:#F08A7E;color:#fff;font-size:10px;
    display:flex;align-items:center;justify-content:center;
    padding:0 4px;font-weight:600;
  }

  /* ===== Home Indicator ===== */
  .home-indicator{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;border-radius:3px;
    background:rgba(255,255,255,.35);z-index:200;
  }

  /* ===== Responsive: desktop keeps the floating phone shell ===== */
  @media(max-height:900px) and (min-width:501px){
    .phone-stage{transform:scale(.92);transform-origin:center}
  }
  @media(max-height:800px) and (min-width:501px){
    .phone-stage{transform:scale(.82)}
  }

  /* ===== Mobile / touch: fill the whole screen, drop the phone shell ===== */
  @media(max-width:500px),
         (pointer:coarse) and (max-width:900px){
    html,body{height:100%}
    body{padding:0;min-height:100dvh;overflow:hidden}
    .phone-stage{
      position:fixed;inset:0;
      width:100vw;height:100vh;height:100dvh;
      transform:none;border-radius:0;box-shadow:none;
      background:#1A0F0A;
    }
    .phone-stage::before,.phone-stage::after,
    .side-right,.dynamic-island,.home-indicator{display:none}
    .screen{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:0}
    .status-bar{padding-top:env(safe-area-inset-top)}
    .chat-input{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  }
</style>
</head>

<script>

// 根据话题/关键词返回 mock 回复（积极、温柔、有分寸）
function mockReply(userText){
  const t = (userText||'').toLowerCase();
  if(/心情|难过|不开心|低落|难受|丧/.test(t)){
    return '谢谢你愿意告诉我这些呀。\n心情不好的时候，**不用急着好起来**，先允许自己难过一会儿，也是一种照顾自己的方式。\n\n可以跟我说说，是发生了什么事吗？还是只是莫名的提不起劲？不管是哪一种，我都在这里听你说。 🌿';
  }
  if(/工作|加班|老板|同事|压力/.test(t)){
    return '工作上的事有时候真的会让人喘不过气呢，辛苦你了。\n\n如果可以的话，试着把*让你最累的那一件事*说出来，有时候讲着讲着，心里就没那么堵了。\n\n也要记得，**你的价值不只用工作成绩来定义**，你本身就已经很好了。';
  }
  if(/鼓励|信心|加油|坚持|做不到|打气/.test(t)){
    return '嘿，我想认真地告诉你：**你已经做得很好了**。\n\n我们总是容易看到自己没做到的，却忽略已经走过的路。哪怕今天只前进了一点点，那也是在往前走呀。\n\n想做的事，可以拆成很小很小的一步，先迈出第一步就好，剩下的我陪你慢慢走。 ✨';
  }
  if(/焦虑|紧张|静不下|脑子乱|慌/.test(t)){
    return '焦虑的时候，脑子里像塞了一团乱麻对不对？\n\n我们先一起做个小动作：**慢慢吸气 4 秒，屏住 4 秒，再慢慢呼气 6 秒**，重复三次。\n\n然后把心里最惦记的那件事告诉我，我们一起把它捋顺。一件一件来，不急。 🍃';
  }
  if(/睡不着|失眠|深夜|睡/.test(t)){
    return '睡不着的夜晚是有点难熬呢。\n\n先把手机屏幕调暗一点，试着让肩膀放松下来——你现在是不是不自觉地绷着？\n\n要不要我陪你慢慢数呼吸？或者跟我讲讲你今天印象最深的一个小细节，聊着聊着，困意可能就悄悄来了。 🌙';
  }
  if(/开心|高兴|分享|好事|成功|完成/.test(t)){
    return '哇，听到你这么说我也跟着开心起来了！🎉\n\n快跟我讲讲嘛，是什么样的好事呀？我最喜欢听你分享开心的事了。\n\n你看，生活里总有这样那样的小光亮，值得我们好好记下来。';
  }
  if(/迷茫|方向|不知道|未来|选择/.test(t)){
    return '迷茫其实说明你在认真思考未来呀，这本身就很可贵。\n\n不用急着马上找到答案。可以先告诉我：*现在最让你纠结的是什么*？\n\n我们把选项一个一个摊开看，慢慢就会清楚自己更想要什么了。不管你最后选哪条路，我都支持你。';
  }
  if(/唠|随便|聊聊天|没什么/.test(t)){
    return '好呀，那我们就随便聊聊～ ☕\n\n今天有没有遇到什么有意思的小事？比如路上看到了可爱的小猫，或者吃到了好吃的东西？\n\n哪怕是很琐碎的日常，我也很乐意听。';
  }
  if(/代码|code|编程|程序|bug|python|js|javascript/.test(t)){
    return '写代码遇到卡住的时候确实很磨人呢。\n\n有时候换个思路会清楚很多，比如先把问题拆小。举个小例子：\n\n```\n// 先把大问题拆成小函数\nfunction solve(n) {\n  if (n <= 1) return n;      // 边界\n  return solve(n-1) + solve(n-2); // 递归\n}\n```\n\n你看，把逻辑拆成 `边界` 和 `递归` 两步，思路就清晰多了。\n\n慢慢来，**写代码本来就是不断试错的过程**，卡住不代表你不行，只是还没找到那条路而已。需要的话把具体问题告诉我，我们一起看看。';
  }
  const defs = [
    '嗯嗯，我在听呢。慢慢说，不着急。\n\n不管是什么事，能说出来就已经很棒了。我一直都在。 🌷',
    '谢谢你愿意跟我说这些。\n\n我没办法替你解决所有问题，但我可以陪你一起面对。你现在感觉怎么样？',
    '我懂你的感受。\n\n有时候不用急着做决定，先照顾好自己的情绪才是最重要的。要不要先深呼吸一下？',
    '听到你这么说，我心里也软软的。\n\n你已经很努力了呀，真的。允许自己偶尔慢下来，没关系的。 🌸'
  ];
  return defs[Math.floor(Math.random()*defs.length)];
}

// ---------- 状态 ----------
const state = {
  currentId: 'axi',
  typing: false
};

// ---------- 状态栏时间 ----------
function updateStatusTime(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}

// ---------- 快捷标签 ----------
function renderQuickTags(){
  const wrap = document.getElementById('quickTags');
  wrap.innerHTML = QUICK_TAGS.map((t,i)=>`
    <div class="quick-tag" data-idx="${i}">
      <span class="emoji">${t.emoji}</span>
      <span>${t.label}</span>
    </div>
  `).join('');
  wrap.querySelectorAll('.quick-tag').forEach(el=>{
    el.addEventListener('click',()=>{
      const tag = QUICK_TAGS[+el.dataset.idx];
      const input = document.getElementById('msgInput');
      input.value = tag.text;
      sendMessage(tag.text);
      input.value = '';
    });
  });
}

// ---------- 渲染会话列表 ----------
function renderConvList(){
  const list = document.getElementById('convList');
  list.innerHTML = CONVERSATIONS.map(c=>`
    <div class="conv-item ${c.id===state.currentId?'active':''}" data-id="${c.id}">
      <div class="conv-avatar ${c.avatarClass}">${c.name[0]}</div>
      ${c.online?'<span class="conv-online-dot"></span>':''}
      <div class="conv-body">
        <div class="conv-name">${c.name}<span class="conv-time">${c.time}</span></div>
        <div class="conv-last">${c.last}</div>
      </div>
      ${c.unread?`<span class="conv-unread">${c.unread}</span>`:''}
    </div>
  `).join('');
  list.querySelectorAll('.conv-item').forEach(el=>{
    el.addEventListener('click',()=>switchConv(el.dataset.id));
  });
}

function switchConv(id){
  state.currentId = id;
  const c = CONVERSATIONS.find(x=>x.id===id);
  if(!c) return;
  document.getElementById('headAvatar').textContent = c.name[0];
  document.getElementById('headAvatar').className = 'header-avatar';
  document.getElementById('headName').textContent = c.name;
  document.getElementById('headStatus').textContent = c.online?'在线聊天中':'离线中';
  c.unread = 0;
  renderConvList();
  renderMessages();
  closeDrawer();
}

// ---------- 渲染消息 ----------
function renderMessages(){
  const c = CONVERSATIONS.find(x=>x.id===state.currentId);
  const body = document.getElementById('chatBody');
  body.innerHTML = '';
  c.messages.forEach(m=>body.appendChild(buildMsgEl(m)));
  scrollBottom();
}

function buildMsgEl(m){
  const wrap = document.createElement('div');
  wrap.className = 'msg '+(m.role==='user'?'user':'ai');
  const av = document.createElement('div');
  av.className = 'msg-avatar '+(m.role==='user'?'user':'ai');
  av.textContent = m.role==='user'?'我':'溪';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatRich(m.text);
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  return wrap;
}

// 简单富文本解析
function formatRich(text){
  text = text.replace(/```([\s\S]*?)```/g,(m,code)=>{
    const highlighted = code
      .replace(/(\/\/.*$)/gm,'<span class="c">$1</span>')
      .replace(/\b(function|return|if|for|const|let|var|else)\b/g,'<span class="k">$1</span>')
      .replace(/(".*?"|'.*?')/g,'<span class="s">$1</span>');
    return `<pre class="code-block">${highlighted.trim()}</pre>`;
  });
  text = text.replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  text = text.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  text = text.replace(/\n/g,'<br>');
  return text;
}

function scrollBottom(){
  const body = document.getElementById('chatBody');
  body.scrollTop = body.scrollHeight;
}

// ---------- 打字机流式回复 ----------
function typeStream(bubbleEl, fullText, onDone){
  bubbleEl.innerHTML = '';
  let i = 0;
  const tokens = tokenizeRich(fullText);
  let output = '';
  const timer = setInterval(()=>{
    if(i>=tokens.length){
      clearInterval(timer);
      bubbleEl.innerHTML = formatRich(fullText);
      onDone && onDone();
      return;
    }
    output += tokens[i];
    bubbleEl.innerHTML = formatRich(output) + '<span class="caret"></span>';
    scrollBottom();
    i++;
  }, 28);
}

function tokenizeRich(text){
  const tokens = [];
  const re = /(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`|```[\s\S]*?```)/g;
  let last = 0, m;
  while((m=re.exec(text))!==null){
    for(let j=last;j<m.index;j++) tokens.push(text[j]);
    tokens.push(m[0]);
    last = m.index + m[0].length;
  }
  for(let j=last;j<text.length;j++) tokens.push(text[j]);
  return tokens;
}

// ---------- 发送消息 ----------
function sendMessage(text){
  if(state.typing) return;
  text = (text||'').trim();
  if(!text) return;
  const c = CONVERSATIONS.find(x=>x.id===state.currentId);

  c.messages.push({role:'user', text});
  c.last = text.length>14?text.slice(0,14)+'…':text;
  c.time = '刚刚';
  renderConvList();
  renderMessages();

  state.typing = true;
  setInputDisabled(true);
  showLoading();

  setTimeout(()=>{
    hideLoading();
    const reply = mockReply(text);
    const msgEl = appendAIMsg();
    const bubble = msgEl.querySelector('.bubble');
    typeStream(bubble, reply, ()=>{
      c.messages.push({role:'assistant', text:reply});
      c.last = reply.replace(/[*`\n]/g,'').slice(0,14)+'…';
      c.time = '刚刚';
      renderConvList();
      state.typing = false;
      setInputDisabled(false);
      document.getElementById('msgInput').focus();
    });
  }, 900 + Math.random()*600);
}

function appendAIMsg(){
  const body = document.getElementById('chatBody');
  const el = buildMsgEl({role:'assistant', text:''});
  body.appendChild(el);
  scrollBottom();
  return el;
}

let loadingEl = null;
function showLoading(){
  const body = document.getElementById('chatBody');
  loadingEl = document.createElement('div');
  loadingEl.className = 'msg ai';
  loadingEl.id = 'loadingMsg';
  loadingEl.innerHTML = `
    <div class="msg-avatar ai">溪</div>
    <div class="bubble loading-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  body.appendChild(loadingEl);
  scrollBottom();
}
function hideLoading(){
  if(loadingEl){ loadingEl.remove(); loadingEl=null; }
}

function setInputDisabled(disabled){
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  input.disabled = disabled;
  btn.disabled = disabled;
  if(!disabled) input.focus();
}

// ---------- 抽屉 ----------
function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

// ---------- 事件绑定 ----------
document.getElementById('chatForm').addEventListener('submit',e=>{
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  btn.classList.add('sending');
  setTimeout(()=>btn.classList.remove('sending'),500);
  sendMessage(input.value);
  input.value = '';
});

document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

// ---------- 初始化 ----------
updateStatusTime();
setInterval(updateStatusTime, 30000);
renderQuickTags();
renderConvList();
renderMessages();
</script>
